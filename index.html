<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YMH219 - Flappy Bird (Mobil & Masaüstü)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-bar {
      width: 100%;
      max-width: 540px;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 2px solid #334155;
      z-index: 10;
    }
    .hud-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 11px;
      font-weight: 700;
      font-size: 12.5px;
      color: #fff;
      cursor: pointer;
    }
    .btn-start { background: #10b981; }
    .btn-pause { background: #3b82f6; }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .stats {
      display: flex;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .score-text { color: #facc15; }
    .high-text { color: #94a3b8; }
    .lvl-text { color: #38bdf8; }
    .game-wrapper {
      flex: 1;
      width: 100%;
      max-width: 540px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
    /* Game Over Tekrar Başlama Onay Modalı */
    .gameover-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 88%;
      max-width: 390px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 14px;
      padding: 20px 18px;
      text-align: center;
      color: #f8fafc;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 25;
    }
    .gameover-modal.active {
      display: block;
    }
    .gameover-title {
      color: #f87171;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 10px 0;
    }
    .gameover-stats {
      font-size: 15px;
      color: #e2e8f0;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .gameover-question {
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 16px;
    }
    .gameover-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn-choice {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-choice:active {
      transform: scale(0.96);
    }
    .btn-yes {
      background: #16a34a;
    }
    .btn-no {
      background: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud-bar">
    <div class="hud-row">
      <div class="hud-controls">
        <button class="btn btn-start" id="btnStart">Oyunu Başlat</button>
        <button class="btn btn-pause" id="btnPause">Duraklat</button>
      </div>
      <div class="stats">
        <span class="score-text" id="lblScore">Skor: 0</span>
        <span class="high-text" id="lblHigh">En Yüksek: 0</span>
        <span class="lvl-text" id="lblLevel">Sv: 1</span>
      </div>
    </div>
    <div class="hud-row">
      <div class="hud-controls" style="width:100%; justify-content:space-between;">
        <select id="selDiff" title="Zorluk Seviyesi">
          <option value="Kolay">Zorluk: Kolay</option>
          <option value="Normal" selected>Zorluk: Normal</option>
          <option value="Zor">Zorluk: Zor</option>
        </select>
        <select id="selTheme" title="Arka Plan Teması">
          <option value="Gunduz" selected>Tema: Gündüz ☀️</option>
          <option value="GunBatimi">Tema: Gün Batımı 🌅</option>
          <option value="Gece">Tema: Gece 🌙</option>
          <option value="KarliKis">Tema: Karlı Kış ❄️</option>
        </select>
        <select id="selBird" title="Kuş Karakteri Seçimi">
          <option value="SariKanarya" selected>Kuş: Sarı Kanarya 🐤</option>
          <option value="PolisKusu">Kuş: Polis Kuşu 👮</option>
          <option value="KizilAnka">Kuş: Kızıl Anka 🔥</option>
          <option value="MaviFirtina">Kuş: Mavi Fırtına ⚡</option>
          <option value="ZumrutKusu">Kuş: Zümrüt Kuşu 🌿</option>
          <option value="MorGolge">Kuş: Mor Gölge 🔮</option>
        </select>
      </div>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="480" height="720"></canvas>

    <!-- Oyun Bittiğinde Açılan Seçenek Ekranı -->
    <div class="gameover-modal" id="gameOverModal">
      <div class="gameover-title">GAME OVER - OYUN BİTTİ</div>
      <div class="gameover-stats" id="gameOverSummary">
        Skorunuz: 0 | En Yüksek: 0<br />Seviye: 1 (Normal)
      </div>
      <div class="gameover-question">Tekrar başlamak istiyor musunuz?</div>
      <div class="gameover-actions">
        <button class="btn-choice btn-yes" id="btnRetryYes">✔ Evet, Tekrar Başla</button>
        <button class="btn-choice btn-no" id="btnRetryNo">✖ Hayır, Ana Ekran</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const btnStart = document.getElementById("btnStart");
    const btnPause = document.getElementById("btnPause");
    const selDiff = document.getElementById("selDiff");
    const selTheme = document.getElementById("selTheme");
    const selBird = document.getElementById("selBird");
    const lblScore = document.getElementById("lblScore");
    const lblHigh = document.getElementById("lblHigh");
    const lblLevel = document.getElementById("lblLevel");
    const gameOverModal = document.getElementById("gameOverModal");
    const gameOverSummary = document.getElementById("gameOverSummary");
    const btnRetryYes = document.getElementById("btnRetryYes");
    const btnRetryNo = document.getElementById("btnRetryNo");

    const DIFFICULTY = {
      Kolay:  { speed: 2.2, gap: 195, gravity: 0.20, jump: -5.6 },
      Normal: { speed: 2.7, gap: 172, gravity: 0.24, jump: -6.0 },
      Zor:    { speed: 3.3, gap: 150, gravity: 0.30, jump: -6.4 }
    };

    const THEMES = {
      Gunduz: {
        skyTop: "#38bdf8", skyBottom: "#bae6fd",
        soil: "#d9a066", grass: "#65a30d", stripe: "#84cc16",
        pipeLight: "#22c55e", pipeDark: "#15803d", stars: false
      },
      GunBatimi: {
        skyTop: "#7c2d12", skyBottom: "#fb923c",
        soil: "#78350f", grass: "#b45309", stripe: "#d97706",
        pipeLight: "#14b8a6", pipeDark: "#0f766e", stars: false
      },
      Gece: {
        skyTop: "#0f172a", skyBottom: "#312e81",
        soil: "#1e293b", grass: "#10b981", stripe: "#34d399",
        pipeLight: "#38bdf8", pipeDark: "#0369a1", stars: true
      },
      KarliKis: {
        skyTop: "#7dd3fc", skyBottom: "#f0f9ff",
        soil: "#94a3b8", grass: "#f8fafc", stripe: "#e2e8f0",
        pipeLight: "#3b82f6", pipeDark: "#1d4ed8", stars: false
      }
    };

    const BIRD_SKINS = {
      SariKanarya: { body: "#facc15", wing: "#fef08a", beak: "#f97316", outline: "#713f12", crest: false, police: false },
      PolisKusu:   { body: "#1e3a8a", wing: "#3b82f6", beak: "#f97316", outline: "#0f172a", crest: false, police: true },
      KizilAnka:   { body: "#ef4444", wing: "#fde047", beak: "#f97316", outline: "#7f1d1d", crest: true,  police: false },
      MaviFirtina: { body: "#0ea5e9", wing: "#e0f2fe", beak: "#facc15", outline: "#0c4a6e", crest: true,  police: false },
      ZumrutKusu:  { body: "#10b981", wing: "#a7f3d0", beak: "#f97316", outline: "#064e3b", crest: true,  police: false },
      MorGolge:    { body: "#a855f7", wing: "#f5d0fe", beak: "#facc15", outline: "#581c87", crest: true,  police: false }
    };

    let state = "READY"; // READY, PLAYING, PAUSED, GAMEOVER
    let score = 0;
    let highScore = parseInt(localStorage.getItem("ymh219_flappy_high") || "0", 10);
    let level = 1;
    let currentDiff = "Normal";
    let currentTheme = "Gunduz";
    let currentBirdSkin = "SariKanarya";
    let pipeSpeed = DIFFICULTY.Normal.speed;
    let groundOffset = 0;
    const groundHeight = 70;

    const bird = {
      x: 95,
      y: 280,
      w: 40,
      h: 30,
      vy: 0,
      wingPhase: 0
    };

    let pipes = [];
    const pipeWidth = 64;
    const pipeSpacing = 250;

    function initPipes() {
      pipes = [];
      const gap = DIFFICULTY[currentDiff].gap;
      for (let i = 0; i < 3; i++) {
        pipes.push({
          x: 340 + i * pipeSpacing,
          gapY: randomGapY(gap),
          gapH: gap,
          scored: false
        });
      }
    }

    function randomGapY(gapH) {
      const minTop = 65;
      const maxTop = canvas.height - groundHeight - gapH - 65;
      return Math.floor(minTop + Math.random() * Math.max(40, maxTop - minTop));
    }

    function resetGame() {
      score = 0;
      level = 1;
      currentDiff = selDiff.value;
      currentTheme = selTheme.value;
      currentBirdSkin = selBird.value;
      pipeSpeed = DIFFICULTY[currentDiff].speed;
      bird.x = 95;
      bird.y = (canvas.height - groundHeight) / 2 - 20;
      bird.vy = 0;
      initPipes();
      updateHud();
      gameOverModal.classList.remove("active");
    }

    function triggerGameOver() {
      state = "GAMEOVER";
      updateHud();
      gameOverSummary.innerHTML = `Skorunuz: <b>${score}</b> &nbsp;|&nbsp; En Yüksek: <b>${highScore}</b><br/>Ulaşılan Seviye: <b>${level}</b> (${currentDiff})`;
      gameOverModal.classList.add("active");
    }

    function jump() {
      // Oyun bittiğinde ekrana dokunmak veya Space'e basmak oyunu hemen yeniden BAŞLATMAZ!
      if (state === "GAMEOVER") {
        return;
      }

      if (state === "READY") {
        resetGame();
        state = "PLAYING";
        bird.vy = DIFFICULTY[currentDiff].jump;
      } else if (state === "PLAYING") {
        bird.vy = DIFFICULTY[currentDiff].jump;
      }
      updateHud();
    }

    function updateHud() {
      lblScore.textContent = `Skor: ${score}`;
      lblHigh.textContent = `En Yüksek: ${highScore}`;
      lblLevel.textContent = `Sv: ${level}`;
    }

    function update(dt) {
      if (state !== "PLAYING") return;

      const cfg = DIFFICULTY[currentDiff];
      bird.vy = Math.min(5.8, bird.vy + cfg.gravity * dt);
      bird.y += bird.vy * dt;
      bird.wingPhase = (bird.wingPhase + dt) % 12;
      if (bird.y < 0) {
        bird.y = 0;
        bird.vy = 0;
      }

      groundOffset = (groundOffset + pipeSpeed * dt) % 32;
      const groundTop = canvas.height - groundHeight;

      let rightmost = Math.max(...pipes.map(p => p.x));
      for (const p of pipes) {
        p.x -= pipeSpeed * dt;

        if (!p.scored && p.x + pipeWidth < bird.x) {
          p.scored = true;
          score++;
          const newLvl = Math.floor(score / 5) + 1;
          if (newLvl > level) {
            level = newLvl;
            pipeSpeed += 0.25;
          }
          if (score > highScore) {
            highScore = score;
            localStorage.setItem("ymh219_flappy_high", String(highScore));
          }
          updateHud();
        }

        if (p.x + pipeWidth < 0) {
          p.x = Math.max(canvas.width + 20, rightmost + pipeSpacing);
          p.gapH = cfg.gap;
          p.gapY = randomGapY(cfg.gap);
          p.scored = false;
          rightmost = p.x;
        }
      }

      // Çarpışma kontrolü
      const bx = bird.x + 4, by = bird.y + 4, bw = bird.w - 8, bh = bird.h - 8;
      if (by + bh >= groundTop) {
        triggerGameOver();
        return;
      }

      for (const p of pipes) {
        const hitX = bx + bw > p.x && bx < p.x + pipeWidth;
        const hitTop = by < p.gapY;
        const hitBottom = by + bh > p.gapY + p.gapH;
        if (hitX && (hitTop || hitBottom)) {
          triggerGameOver();
          return;
        }
      }
    }

    function draw() {
      const W = canvas.width;
      const H = canvas.height;
      const groundTop = H - groundHeight;
      const theme = THEMES[currentTheme] || THEMES.Gunduz;

      // Gökyüzü
      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundTop);
      skyGrad.addColorStop(0, theme.skyTop);
      skyGrad.addColorStop(1, theme.skyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, groundTop);

      // Gece yıldızları ve ay
      if (theme.stars) {
        ctx.fillStyle = "#fef08a";
        const stars = [[45,40],[130,95],[210,35],[290,115],[380,45],[430,105],[90,165],[340,175]];
        for (const [sx, sy] of stars) {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#fef9c3";
        ctx.beginPath();
        ctx.arc(W - 65, 55, 22, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bulutlar
      ctx.fillStyle = theme.stars ? "rgba(148,163,184,0.35)" : "rgba(255,255,255,0.82)";
      drawCloud(60, 80, 90, 34);
      drawCloud(250, 55, 110, 38);
      drawCloud(370, 110, 85, 30);

      // Borular
      for (const p of pipes) {
        drawPipe(p.x, 0, pipeWidth, p.gapY, true, theme);
        const botY = p.gapY + p.gapH;
        drawPipe(p.x, botY, pipeWidth, Math.max(0, groundTop - botY), false, theme);
      }

      // Zemin
      ctx.fillStyle = theme.soil;
      ctx.fillRect(0, groundTop, W, groundHeight);
      ctx.fillStyle = theme.grass;
      ctx.fillRect(0, groundTop, W, 16);

      // Kuş
      drawBird(bird.x, bird.y, bird.w, bird.h);

      // Canlı Skor
      ctx.font = "bold 38px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillText(String(score), W / 2 + 2, 56);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(score), W / 2, 54);

      if (state === "READY" || state === "PAUSED") {
        drawOverlay(W, groundTop);
      }
    }

    function drawCloud(x, y, w, h) {
      ctx.beginPath();
      ctx.ellipse(x + w * 0.3, y + h * 0.55, w * 0.25, h * 0.38, 0, 0, Math.PI * 2);
      ctx.ellipse(x + w * 0.5, y + h * 0.45, w * 0.28, h * 0.48, 0, 0, Math.PI * 2);
      ctx.ellipse(x + w * 0.72, y + h * 0.58, w * 0.24, h * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPipe(x, y, w, h, isTop, theme) {
      if (h <= 0) return;
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, theme.pipeLight);
      grad.addColorStop(1, theme.pipeDark);
      ctx.fillStyle = grad;
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 2;

      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);

      const capH = Math.min(22, h);
      const capY = isTop ? y + h - capH : y;
      ctx.fillRect(x - 4, capY, w + 8, capH);
      ctx.strokeRect(x - 4, capY, w + 8, capH);
    }

    function drawBird(x, y, w, h) {
      const skin = BIRD_SKINS[currentBirdSkin] || BIRD_SKINS.SariKanarya;
      ctx.save();
      // Gövde
      ctx.fillStyle = skin.body;
      ctx.strokeStyle = skin.outline;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Polis üniforması detayları (Beyaz yaka, kırmızı kravat ve göğüs rozeti)
      if (skin.police) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(x + 22, y + 18);
        ctx.lineTo(x + 32, y + 18);
        ctx.lineTo(x + 27, y + 27);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.moveTo(x + 26, y + 19);
        ctx.lineTo(x + 29, y + 19);
        ctx.lineTo(x + 28, y + 28);
        ctx.lineTo(x + 25, y + 28);
        ctx.closePath();
        ctx.fill();

        // Altın göğüs rozeti
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.ellipse(x + 21, y + 17, 3, 3.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Üst İbik / Tüy
      if (skin.crest) {
        ctx.fillStyle = skin.wing;
        ctx.beginPath();
        ctx.moveTo(x + 14, y + 2);
        ctx.lineTo(x + 20, y - 6);
        ctx.lineTo(x + 26, y + 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Kanat
      const wingY = bird.wingPhase < 6 ? y + 13 : y + 17;
      ctx.fillStyle = skin.wing;
      ctx.beginPath();
      ctx.ellipse(x + 14, wingY, 8, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Göz
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x + w - 10, y + 10, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(x + w - 9, y + 10, 2, 0, Math.PI * 2);
      ctx.fill();

      // Polis Şapkası (Kep, beyaz şerit, siyah siperlik ve altın kokart)
      if (skin.police) {
        ctx.fillStyle = "#172554";
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 3);
        ctx.lineTo(x + 10, y - 7);
        ctx.lineTo(x + 32, y - 8);
        ctx.lineTo(x + 33, y + 3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Beyaz şapka şeridi
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 8, y + 1, 25, 3);

        // Siyah siperlik
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.moveTo(x + 24, y + 2);
        ctx.lineTo(x + 41, y + 5);
        ctx.lineTo(x + 39, y + 8);
        ctx.lineTo(x + 24, y + 5);
        ctx.closePath();
        ctx.fill();

        // Altın polis arması
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.ellipse(x + 26, y - 2, 2.6, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Gaga
      ctx.fillStyle = skin.beak;
      ctx.beginPath();
      ctx.moveTo(x + w - 2, y + 12);
      ctx.lineTo(x + w + 9, y + 16);
      ctx.lineTo(x + w - 2, y + 21);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawOverlay(W, groundTop) {
      const boxW = W - 48;
      const boxH = 210;
      const boxX = 24;
      const boxY = (groundTop - boxH) / 2;

      ctx.fillStyle = "rgba(15, 23, 42, 0.90)";
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.textAlign = "center";
      if (state === "PAUSED") {
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 24px 'Segoe UI', sans-serif";
        ctx.fillText("OYUN DURAKLATILDI", W / 2, boxY + 60);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "16px 'Segoe UI', sans-serif";
        ctx.fillText("Devam etmek için 'Duraklat' butonuna dokunun.", W / 2, boxY + 120);
      } else {
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 23px 'Segoe UI', sans-serif";
        ctx.fillText("FLAPPY BIRD MOBİL", W / 2, boxY + 46);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "14.5px 'Segoe UI', sans-serif";
        ctx.fillText("Üst menüden Tema, Kuş ve Zorluk seçebilirsiniz!", W / 2, boxY + 86);
        ctx.fillText(`En Yüksek Skor: ${highScore}  |  Emine Zehra Duyar`, W / 2, boxY + 118);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        ctx.fillText("Başlamak ve zıplamak için ekrana dokunun!", W / 2, boxY + 168);
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      jump();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        jump();
      }
    });

    btnStart.addEventListener("click", () => {
      resetGame();
      state = "PLAYING";
    });

    btnRetryYes.addEventListener("click", () => {
      resetGame();
      state = "PLAYING";
    });

    btnRetryNo.addEventListener("click", () => {
      resetGame();
      state = "READY";
    });

    btnPause.addEventListener("click", () => {
      if (state === "PLAYING") state = "PAUSED";
      else if (state === "PAUSED") state = "PLAYING";
    });

    selDiff.addEventListener("change", () => {
      currentDiff = selDiff.value;
      if (state !== "PLAYING") resetGame();
    });

    selTheme.addEventListener("change", () => {
      currentTheme = selTheme.value;
    });

    selBird.addEventListener("change", () => {
      currentBirdSkin = selBird.value;
    });

    resetGame();
    let lastFrameTime = performance.now();
    function loop(now) {
      const elapsed = now - lastFrameTime;
      lastFrameTime = now;
      // 144Hz / 165Hz / 240Hz ekranlarda hızlanmayı önlemek için 60 FPS (16.67ms) tabanlı deltaTime
      const dt = Math.min(2.0, Math.max(0.1, elapsed / 16.667));
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
